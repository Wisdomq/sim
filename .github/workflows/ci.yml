name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "backend[dev]"
      - name: Ruff report
        # Currently non-blocking: the repo carries pre-existing lint debt
        # (~77 items). Failures here surface in logs; pytest gates the merge.
        run: |
          cd backend && ruff check src/ ../scripts/ ../tests/ || echo "::warning::ruff reported issues (non-blocking)"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "backend[dev]"
      - name: Run pytest
        working-directory: backend
        run: PYTHONPATH=src pytest -q --disable-warnings
      - name: Upload coverage (untracked)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/
          if-no-files-found: ignore

  web:
    name: Web lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile tests (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/simcards_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze

  docker-build:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, web]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/simcards-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/simcards-backend:latest
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/simcards-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/simcards-web:latest