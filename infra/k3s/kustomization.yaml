apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simcards
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
images:
  - name: ghcr.io/simcards/backend
    newTag: latest
  - name: ghcr.io/simcards/web
    newTag: latest