apiVersion: v1
kind: Service
metadata:
  name: simcards-redis
  namespace: simcards
spec:
  selector:
    app: simcards-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simcards-redis
  namespace: simcards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simcards-redis
  template:
    metadata:
      labels:
        app: simcards-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi