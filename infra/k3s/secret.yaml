apiVersion: v1
kind: Secret
metadata:
  name: simcards-secrets
  namespace: simcards
type: Opaque
stringData:
  POSTGRES_USER: simcards_user
  POSTGRES_PASSWORD: change-me-postgres-password
  POSTGRES_DB: simcards
  # Generate with: openssl rand -hex 32
  SECRET_KEY: change-me-64-char-hex-secret-key