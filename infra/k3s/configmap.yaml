apiVersion: v1
kind: ConfigMap
metadata:
  name: simcards-env
  namespace: simcards
data:
  APP_NAME: "SIM Stock & Sales Tracking Platform"
  VERSION: "0.1.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  DATABASE_URL: "postgresql://simcards_user:simcards_password@simcards-postgres:5432/simcards"
  REDIS_URL: "redis://simcards-redis:6379/0"
  LOGIN_RATE_LIMIT_ATTEMPTS: "10"
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
  CORS_ORIGINS: "https://simcards.example.com"
  UPLOAD_DIR: "/app/uploads"
  # Optional S3-compatible object storage (uncomment to stop using shared PVC):
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  # AWS_REGION: "us-east-1"
  # S3_BUCKET: "simcards-uploads"
  # S3_ENDPOINT_URL: "https://s3.example.com"